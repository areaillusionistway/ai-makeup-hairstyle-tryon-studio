[project]
name = "ai-makeup-hairstyle-tryon-studio"
version = "0.4.2"
description = "Windows desktop AI makeup and hairstyle try-on generator"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "tryon-studio contributors" }]
dependencies = [
    "PySide6>=6.7",
    "opencv-python>=4.10",
    "onnxruntime-gpu>=1.18; platform_system=='Windows'",
    "torch>=2.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]

[project.scripts]
tryon-studio = "studio.bootstrap.app_entry:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"